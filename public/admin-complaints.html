<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage All Complaints — Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .action-btn-group { display: flex; gap: 6px; }
  </style>
</head>
<body data-page="admin-complaints">

  <div class="app-layout">
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu"></button>
          <div>
            <div class="page-title">Manage Complaints</div>
            <div class="page-subtitle">View, assign, and update all campus complaints</div>
          </div>
        </div>
        <div class="header-right">
          <button class="btn btn-ghost btn-sm" onclick="logout()" id="header-logout-btn">
            Sign Out
          </button>
          <a href="/admin-profile.html"><div class="header-avatar" id="header-avatar">A</div></a>
        </div>
      </header>

      <main class="page-content">
        <div class="card">
          <!-- Filters -->
          <div class="filters-bar">
            <div class="search-input-wrap">
              <span class="search-icon" id="search-icon"></span>
              <input id="search" type="text" class="search-input" placeholder="Search ticket, title, student, room…">
            </div>
            <select id="filter-status" class="filter-select">
              <option value="">All Statuses</option>
              <option value="Submitted">Submitted / Pending</option>
              <option value="Assigned">Assigned</option>
              <option value="In Progress">In Progress</option>
              <option value="Resolved">Resolved</option>
              <option value="Closed">Closed</option>
            </select>
            <select id="filter-category" class="filter-select">
              <option value="">All Categories</option>
              <option>Electrical</option>
              <option>Plumbing</option>
              <option>Cleanliness</option>
              <option>Furniture</option>
              <option>Internet and Networking</option>
              <option>Laboratory Equipment</option>
              <option>Hostel Maintenance</option>
              <option>Other</option>
            </select>
            <select id="filter-priority" class="filter-select">
              <option value="">All Priorities</option>
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
              <option>Urgent</option>
            </select>
          </div>

          <!-- Table Container -->
          <div id="table-body">
            <div class="loading-overlay"><div class="spinner"></div></div>
          </div>

          <!-- Pagination -->
          <div class="pagination-wrap">
            <span id="page-info" class="text-muted"></span>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Assign Modal -->
  <div class="modal-overlay" id="assign-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="assign-modal-title">Assign Complaint to Staff</div>
        <button class="modal-close" onclick="closeModal('assign-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="assign-complaint-id">
        <div class="form-group">
          <label class="form-label" for="staff-select">Select Maintenance Staff <span class="required">*</span></label>
          <select id="staff-select" class="form-control">
            <option value="">Loading staff members…</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="assign-note">Assignment Note (optional)</label>
          <textarea id="assign-note" class="form-control" rows="3" placeholder="Add instructions for the assigned staff…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('assign-modal')">Cancel</button>
        <button class="btn btn-primary" id="confirm-assign-btn" onclick="executeAssign()">Assign Staff</button>
      </div>
    </div>
  </div>

  <!-- Status Update Modal -->
  <div class="modal-overlay" id="status-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="status-modal-title">Update Complaint Status</div>
        <button class="modal-close" onclick="closeModal('status-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="status-complaint-id">
        <div class="form-group">
          <label class="form-label" for="status-select">Select New Status <span class="required">*</span></label>
          <select id="status-select" class="form-control">
            <option value="Submitted">Submitted</option>
            <option value="Assigned">Assigned</option>
            <option value="In Progress">In Progress</option>
            <option value="Resolved">Resolved</option>
            <option value="Closed">Closed</option>
          </select>
        </div>
        <div class="form-group">
          <label class="form-label" for="status-note">Status Note</label>
          <textarea id="status-note" class="form-control" rows="3" placeholder="Reason or update details…"></textarea>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('status-modal')">Cancel</button>
        <button class="btn btn-primary" id="confirm-status-btn" onclick="executeStatusUpdate()">Update Status</button>
      </div>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script>
    const user = requireAuth(['admin']);
    if (user) {
      initSidebar('admin', 'admin-complaints');
      document.getElementById('menu-toggle').innerHTML = icon('menu', 18);
      document.getElementById('header-logout-btn').innerHTML = `${icon('log-out', 15)} <span>Sign Out</span>`;
      document.getElementById('search-icon').innerHTML = icon('search', 16);

      const urlParams = new URLSearchParams(window.location.search);
      const searchParam = urlParams.get('search');
      if (searchParam) {
        document.getElementById('search').value = searchParam;
      }
      loadComplaints();
      loadStaffList();
      setupDataSync(loadComplaints, 4000);
    }

    let allComplaints = [];
    let staffMembers = [];
    let currentPage = 1;
    const PAGE_SIZE = 10;

    async function loadStaffList() {
      try {
        staffMembers = await apiGet('/users?role=staff') || [];
        const sel = document.getElementById('staff-select');
        if (!staffMembers.length) {
          sel.innerHTML = '<option value="">No staff accounts found.</option>';
          return;
        }
        sel.innerHTML = '<option value="">Select Staff Member</option>' +
          staffMembers.map(s => `<option value="${s._id}">${s.name} (${s.department || 'Maintenance'})</option>`).join('');
      } catch (err) {
        console.error('Failed to load staff list:', err);
      }
    }

    async function loadComplaints() {
      try {
        allComplaints = await apiGet('/complaints') || [];
        applyFilters();
      } catch (err) {
        document.getElementById('table-body').innerHTML =
          `<div class="empty-state"><div class="empty-icon">${icon('alert-circle', 36)}</div><h3>Failed to load complaints</h3><p>${err.message}</p></div>`;
      }
    }

    function applyFilters() {
      const search = document.getElementById('search').value.toLowerCase().trim();
      const status = document.getElementById('filter-status').value;
      const category = document.getElementById('filter-category').value;
      const priority = document.getElementById('filter-priority').value;

      let filtered = allComplaints.filter(c => {
        if (search) {
          const matchTicket = (c.ticketId || '').toLowerCase().includes(search);
          const matchTitle = (c.title || '').toLowerCase().includes(search);
          const matchStudent = (c.studentName || c.student?.name || '').toLowerCase().includes(search);
          const matchRoom = (c.roomNumber || '').toLowerCase().includes(search);
          if (!matchTicket && !matchTitle && !matchStudent && !matchRoom) return false;
        }
        if (status) {
          if (status === 'Submitted' && !(c.status === 'Submitted' || c.status === 'Pending')) return false;
          if (status !== 'Submitted' && c.status !== status) return false;
        }
        if (category && c.category !== category) return false;
        if (priority && c.priority !== priority) return false;
        return true;
      });

      currentPage = 1;
      renderTable(filtered);
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('filter-status').addEventListener('change', applyFilters);
    document.getElementById('filter-category').addEventListener('change', applyFilters);
    document.getElementById('filter-priority').addEventListener('change', applyFilters);

    function renderTable(filtered) {
      const body = document.getElementById('table-body');
      const total = filtered.length;
      const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
      const start = (currentPage - 1) * PAGE_SIZE;
      const paged = filtered.slice(start, start + PAGE_SIZE);

      document.getElementById('page-info').textContent = total
        ? `Showing ${start + 1}–${Math.min(start + PAGE_SIZE, total)} of ${total} complaints`
        : '0 complaints found';

      if (!paged.length) {
        body.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${icon('clipboard', 40)}</div>
            <h3>No complaints found</h3>
            <p>Try modifying your filters or search terms.</p>
          </div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      body.innerHTML = `
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>Ticket ID</th>
                <th>Title / Student</th>
                <th>Location</th>
                <th>Category</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Assigned To</th>
                <th>Date</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="complaints-tbody"></tbody>
          </table>
        </div>`;

      const tbody = document.getElementById('complaints-tbody');
      paged.forEach(c => {
        const tr = document.createElement('tr');
        const assignedName = c.assignedStaff ? c.assignedStaff.name : '<span style="color:var(--gray-400)">Unassigned</span>';
        tr.innerHTML = `
          <td><span class="ticket-id">${c.ticketId || c._id.slice(-6).toUpperCase()}</span></td>
          <td>
            <div style="font-weight:600; color:var(--gray-800);">${c.title || c.category}</div>
            <div style="font-size:12px; color:var(--gray-500);">${c.studentName || c.student?.name || 'Student'}</div>
          </td>
          <td>${c.building ? c.building + ', ' : ''}Rm ${c.roomNumber}</td>
          <td>${c.category}</td>
          <td>${priorityBadge(c.priority || 'Medium')}</td>
          <td>${statusBadge(c.status)}</td>
          <td>${assignedName}</td>
          <td>${formatDate(c.createdAt)}</td>
          <td>
            <div class="action-btn-group">
              <button class="btn btn-outline btn-sm" title="Assign to Staff" onclick="openAssignModal('${c._id}', '${c.ticketId || ''}', '${c.assignedStaff?._id || ''}')">
                ${icon('wrench', 13)} <span>Assign</span>
              </button>
              <button class="btn btn-outline btn-sm" title="Update Status" onclick="openStatusModal('${c._id}', '${c.ticketId || ''}', '${c.status}')">
                ${icon('refresh', 13)} <span>Status</span>
              </button>
              <button class="btn btn-danger btn-sm" title="Delete Complaint" onclick="confirmDelete('${c._id}', '${c.ticketId || ''}')">
                ${icon('trash', 13)}
              </button>
            </div>
          </td>`;
        tbody.appendChild(tr);
      });

      renderPagination('pagination', currentPage, totalPages, (p) => {
        currentPage = p;
        renderTable(filtered);
      });
    }

    function openAssignModal(id, ticket, currentStaffId) {
      document.getElementById('assign-complaint-id').value = id;
      document.getElementById('assign-modal-title').textContent = `Assign Ticket: ${ticket || id}`;
      document.getElementById('staff-select').value = currentStaffId || '';
      document.getElementById('assign-note').value = '';
      openModal('assign-modal');
    }

    async function executeAssign() {
      const id = document.getElementById('assign-complaint-id').value;
      const staffId = document.getElementById('staff-select').value;
      const note = document.getElementById('assign-note').value.trim();

      if (!staffId) {
        showToast('warning', 'Please select a staff member');
        return;
      }

      const btn = document.getElementById('confirm-assign-btn');
      btn.classList.add('btn-loading'); btn.disabled = true;

      try {
        await apiPatch(`/complaints/${id}/assign`, { staffId, note });
        showToast('success', 'Complaint assigned successfully');
        closeModal('assign-modal');
        loadComplaints();
      } catch (err) {
        showToast('error', 'Assignment failed', err.message);
      } finally {
        btn.classList.remove('btn-loading'); btn.disabled = false;
      }
    }

    function openStatusModal(id, ticket, currentStatus) {
      document.getElementById('status-complaint-id').value = id;
      document.getElementById('status-modal-title').textContent = `Update Ticket: ${ticket || id}`;
      document.getElementById('status-select').value = currentStatus === 'Pending' ? 'Submitted' : currentStatus;
      document.getElementById('status-note').value = '';
      openModal('status-modal');
    }

    async function executeStatusUpdate() {
      const id = document.getElementById('status-complaint-id').value;
      const status = document.getElementById('status-select').value;
      const note = document.getElementById('status-note').value.trim();

      const btn = document.getElementById('confirm-status-btn');
      btn.classList.add('btn-loading'); btn.disabled = true;

      try {
        await apiPatch(`/complaints/${id}/status`, { status, note });
        showToast('success', 'Status updated successfully');
        closeModal('status-modal');
        loadComplaints();
      } catch (err) {
        showToast('error', 'Status update failed', err.message);
      } finally {
        btn.classList.remove('btn-loading'); btn.disabled = false;
      }
    }

    async function confirmDelete(id, ticket) {
      if (!confirm(`Are you sure you want to permanently delete complaint ${ticket || id}? This cannot be undone.`)) {
        return;
      }

      try {
        await apiDelete(`/complaints/${id}`);
        showToast('success', 'Complaint deleted');
        loadComplaints();
      } catch (err) {
        showToast('error', 'Delete failed', err.message);
      }
    }
  </script>
</body>
</html>

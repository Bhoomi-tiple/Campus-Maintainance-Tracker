<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Manage Staff — Admin</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="admin-staff">

  <div class="app-layout">
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu"></button>
          <div>
            <div class="page-title">Manage Staff</div>
            <div class="page-subtitle">Campus maintenance personnel and assignments</div>
          </div>
        </div>
        <div class="header-right">
          <button class="btn btn-primary btn-sm" onclick="openStaffModal()" id="btn-add-staff">
            Add Staff Member
          </button>
          <button class="btn btn-ghost btn-sm" onclick="logout()" id="header-logout-btn">
            Sign Out
          </button>
          <a href="/admin-profile.html"><div class="header-avatar" id="header-avatar">A</div></a>
        </div>
      </header>

      <main class="page-content">
        <div class="card">
          <div class="filters-bar">
            <div class="search-input-wrap">
              <span class="search-icon" id="search-icon"></span>
              <input id="search" type="text" class="search-input" placeholder="Search by name, department, or email…">
            </div>
            <select id="filter-dept" class="filter-select">
              <option value="">All Departments</option>
              <option>Electrical</option>
              <option>Plumbing</option>
              <option>Cleanliness &amp; Housekeeping</option>
              <option>Carpentry &amp; Furniture</option>
              <option>Hostel Maintenance</option>
              <option>IT &amp; Networks</option>
              <option>General Maintenance</option>
            </select>
          </div>

          <div id="table-body">
            <div class="loading-overlay"><div class="spinner"></div></div>
          </div>

          <div class="pagination-wrap">
            <span id="page-info" class="text-muted"></span>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <!-- Staff Modal -->
  <div class="modal-overlay" id="staff-modal">
    <div class="modal-card">
      <div class="modal-header">
        <div class="modal-title" id="staff-modal-title">Add Staff Member</div>
        <button class="modal-close" onclick="closeModal('staff-modal')">&times;</button>
      </div>
      <div class="modal-body">
        <input type="hidden" id="staff-id-field">
        <div class="form-group">
          <label class="form-label" for="staff-name">Full Name <span class="required">*</span></label>
          <input id="staff-name" type="text" class="form-control" placeholder="Ramesh Sharma" required>
        </div>
        <div class="form-group">
          <label class="form-label" for="staff-email">Work Email <span class="required">*</span></label>
          <input id="staff-email" type="email" class="form-control" placeholder="ramesh@college.edu" required>
        </div>
        <div class="form-row">
          <div class="form-group">
            <label class="form-label" for="staff-dept">Maintenance Department <span class="required">*</span></label>
            <select id="staff-dept" class="form-control">
              <option>Electrical</option>
              <option>Plumbing</option>
              <option>Cleanliness &amp; Housekeeping</option>
              <option>Carpentry &amp; Furniture</option>
              <option>Hostel Maintenance</option>
              <option>IT &amp; Networks</option>
              <option>General Maintenance</option>
            </select>
          </div>
          <div class="form-group">
            <label class="form-label" for="staff-phone">Contact Phone</label>
            <input id="staff-phone" type="tel" class="form-control" placeholder="10-digit number">
          </div>
        </div>
        <div class="form-group" id="staff-pw-group">
          <label class="form-label" for="staff-password">Password <span class="required" id="staff-pw-req">*</span></label>
          <input id="staff-password" type="password" class="form-control" placeholder="At least 6 characters">
          <div class="form-hint" id="staff-pw-hint" style="display:none;">Leave blank to keep existing password</div>
        </div>
      </div>
      <div class="modal-footer">
        <button class="btn btn-ghost" onclick="closeModal('staff-modal')">Cancel</button>
        <button class="btn btn-primary" id="save-staff-btn" onclick="saveStaff()">Save Staff</button>
      </div>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script>
    const user = requireAuth(['admin']);
    if (user) {
      initSidebar('admin', 'admin-staff');
      document.getElementById('menu-toggle').innerHTML = icon('menu', 18);
      document.getElementById('header-logout-btn').innerHTML = `${icon('log-out', 15)} <span>Sign Out</span>`;
      document.getElementById('btn-add-staff').innerHTML = `${icon('plus', 14)} <span>Add Staff Member</span>`;
      document.getElementById('search-icon').innerHTML = icon('search', 16);

      loadStaff();
      setupDataSync(loadStaff, 4000);
    }

    let allStaff = [];
    let currentPage = 1;
    const PAGE_SIZE = 10;

    async function loadStaff() {
      try {
        allStaff = await apiGet('/users?role=staff') || [];
        applyFilters();
      } catch (err) {
        document.getElementById('table-body').innerHTML =
          `<div class="empty-state"><div class="empty-icon">${icon('alert-circle', 36)}</div><h3>Failed to load staff</h3><p>${err.message}</p></div>`;
      }
    }

    function applyFilters() {
      const search = document.getElementById('search').value.toLowerCase().trim();
      const dept = document.getElementById('filter-dept').value;

      let filtered = allStaff.filter(s => {
        if (search) {
          const matchName = (s.name || '').toLowerCase().includes(search);
          const matchEmail = (s.email || '').toLowerCase().includes(search);
          const matchDept = (s.department || '').toLowerCase().includes(search);
          if (!matchName && !matchEmail && !matchDept) return false;
        }
        if (dept && s.department !== dept) return false;
        return true;
      });

      currentPage = 1;
      renderTable(filtered);
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('filter-dept').addEventListener('change', applyFilters);

    function renderTable(filtered) {
      const body = document.getElementById('table-body');
      const total = filtered.length;
      const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
      const start = (currentPage - 1) * PAGE_SIZE;
      const paged = filtered.slice(start, start + PAGE_SIZE);

      document.getElementById('page-info').textContent = total
        ? `Showing ${start + 1}–${Math.min(start + PAGE_SIZE, total)} of ${total} staff members`
        : '0 staff members found';

      if (!paged.length) {
        body.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${icon('wrench', 40)}</div>
            <h3>No staff members found</h3>
            <p>Try different filters or add a new staff member.</p>
          </div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      body.innerHTML = `
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>Name</th>
                <th>Work Email</th>
                <th>Department</th>
                <th>Phone</th>
                <th>Total Assigned</th>
                <th>Resolved</th>
                <th>Joined</th>
                <th>Actions</th>
              </tr>
            </thead>
            <tbody id="staff-tbody"></tbody>
          </table>
        </div>`;

      const tbody = document.getElementById('staff-tbody');
      paged.forEach(s => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td style="font-weight:600; color:var(--gray-800);">${s.name}</td>
          <td>${s.email}</td>
          <td><span class="badge badge-assigned">${s.department || 'Maintenance'}</span></td>
          <td>${s.phone || '—'}</td>
          <td><strong>${s.assignedCount || 0}</strong> tickets</td>
          <td><span class="badge badge-resolved">${s.resolvedCount || 0}</span></td>
          <td>${formatDate(s.createdAt)}</td>
          <td>
            <div style="display:flex; gap:6px;">
              <button class="btn btn-outline btn-sm" onclick="editStaff('${s._id}')">${icon('edit', 13)} <span>Edit</span></button>
              <button class="btn btn-danger btn-sm" onclick="deleteStaff('${s._id}', '${s.name}')">${icon('trash', 13)}</button>
            </div>
          </td>`;
        tbody.appendChild(tr);
      });

      renderPagination('pagination', currentPage, totalPages, (p) => {
        currentPage = p;
        renderTable(filtered);
      });
    }

    function openStaffModal() {
      document.getElementById('staff-id-field').value = '';
      document.getElementById('staff-modal-title').textContent = 'Add Staff Member';
      document.getElementById('staff-name').value = '';
      document.getElementById('staff-email').value = '';
      document.getElementById('staff-phone').value = '';
      document.getElementById('staff-dept').value = 'Electrical';
      document.getElementById('staff-password').value = '';
      document.getElementById('staff-password').required = true;
      document.getElementById('staff-pw-req').style.display = 'inline';
      document.getElementById('staff-pw-hint').style.display = 'none';
      openModal('staff-modal');
    }

    function editStaff(id) {
      const staff = allStaff.find(s => s._id === id);
      if (!staff) return;
      document.getElementById('staff-id-field').value = id;
      document.getElementById('staff-modal-title').textContent = `Edit Staff: ${staff.name}`;
      document.getElementById('staff-name').value = staff.name || '';
      document.getElementById('staff-email').value = staff.email || '';
      document.getElementById('staff-phone').value = staff.phone || '';
      document.getElementById('staff-dept').value = staff.department || 'Electrical';
      document.getElementById('staff-password').value = '';
      document.getElementById('staff-password').required = false;
      document.getElementById('staff-pw-req').style.display = 'none';
      document.getElementById('staff-pw-hint').style.display = 'block';
      openModal('staff-modal');
    }

    async function saveStaff() {
      const id = document.getElementById('staff-id-field').value;
      const name = document.getElementById('staff-name').value.trim();
      const email = document.getElementById('staff-email').value.trim();
      const phone = document.getElementById('staff-phone').value.trim();
      const department = document.getElementById('staff-dept').value;
      const password = document.getElementById('staff-password').value;

      if (!name || !email) {
        showToast('warning', 'Missing fields', 'Name and Work Email are required');
        return;
      }

      if (!id && (!password || password.length < 6)) {
        showToast('warning', 'Invalid password', 'Password must be at least 6 characters');
        return;
      }

      const btn = document.getElementById('save-staff-btn');
      btn.classList.add('btn-loading'); btn.disabled = true;

      try {
        if (id) {
          const payload = { name, email, phone, department };
          if (password) payload.password = password;
          await apiPut(`/users/${id}`, payload);
          showToast('success', 'Staff details updated');
        } else {
          await apiPost('/users', { name, email, phone, department, password, role: 'staff' });
          showToast('success', 'Staff account created');
        }
        closeModal('staff-modal');
        loadStaff();
      } catch (err) {
        showToast('error', 'Operation failed', err.message);
      } finally {
        btn.classList.remove('btn-loading'); btn.disabled = false;
      }
    }

    async function deleteStaff(id, name) {
      if (!confirm(`Are you sure you want to delete staff member "${name}"?`)) return;
      try {
        await apiDelete(`/users/${id}`);
        showToast('success', 'Staff deleted');
        loadStaff();
      } catch (err) {
        showToast('error', 'Delete failed', err.message);
      }
    }
  </script>
</body>
</html>

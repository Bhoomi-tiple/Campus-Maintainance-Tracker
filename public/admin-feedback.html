<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Student Feedback — Admin</title>
  <link rel="stylesheet" href="/css/main.css">
  <style>
    .star-display { color: #f59e0b; display: flex; gap: 3px; }
    .feedback-grid { display: grid; grid-template-columns: repeat(auto-fill, minmax(320px, 1fr)); gap: 16px; margin-top: 16px; }
    .feedback-card {
      background: white;
      border: 1px solid var(--gray-200);
      border-radius: var(--radius-md);
      padding: 18px;
      box-shadow: var(--shadow-sm);
      display: flex;
      flex-direction: column;
      gap: 12px;
    }
  </style>
</head>
<body data-page="admin-feedback">

  <div class="app-layout">
    <div id="sidebar-placeholder"></div>

    <div class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu"></button>
          <div>
            <div class="page-title">Student Feedback</div>
            <div class="page-subtitle">Ratings and reviews submitted upon complaint resolution</div>
          </div>
        </div>
        <div class="header-right">
          <button class="btn btn-ghost btn-sm" onclick="logout()" id="header-logout-btn">
            Sign Out
          </button>
          <a href="/admin-profile.html"><div class="header-avatar" id="header-avatar">A</div></a>
        </div>
      </header>

      <main class="page-content">
        <!-- Overview summary -->
        <div class="stats-grid">
          <div class="stat-card">
            <div class="stat-icon yellow" id="icon-fb-star"></div>
            <div class="stat-info">
              <div class="stat-value" id="avg-score">—</div>
              <div class="stat-label">Average Rating</div>
            </div>
          </div>
          <div class="stat-card">
            <div class="stat-icon blue" id="icon-fb-reviews"></div>
            <div class="stat-info">
              <div class="stat-value" id="total-reviews">—</div>
              <div class="stat-label">Total Reviews</div>
            </div>
          </div>
        </div>

        <div class="card">
          <div class="card-header">
            <div>
              <div class="card-title">All Student Feedback</div>
              <div class="card-subtitle">Direct feedback from students on service quality (auto-synced)</div>
            </div>
          </div>
          <div id="feedback-container">
            <div class="loading-overlay"><div class="spinner"></div></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script>
    const user = requireAuth(['admin']);
    if (user) {
      initSidebar('admin', 'admin-feedback');
      document.getElementById('menu-toggle').innerHTML = icon('menu', 18);
      document.getElementById('header-logout-btn').innerHTML = `${icon('log-out', 15)} <span>Sign Out</span>`;
      document.getElementById('icon-fb-star').innerHTML = icon('star', 22);
      document.getElementById('icon-fb-reviews').innerHTML = icon('clipboard-check', 22);

      loadFeedback();
      setupDataSync(loadFeedback, 4000);
    }

    async function loadFeedback() {
      const container = document.getElementById('feedback-container');
      try {
        const feedbackList = await apiGet('/feedback') || [];

        if (!feedbackList.length) {
          container.innerHTML = `
            <div class="empty-state">
              <div class="empty-icon">${icon('star', 36)}</div>
              <h3>No feedback submitted yet</h3>
              <p>Students can rate and review complaints once they are marked as Resolved.</p>
            </div>`;
          document.getElementById('avg-score').textContent = 'N/A';
          document.getElementById('total-reviews').textContent = '0';
          return;
        }

        const total = feedbackList.length;
        const sum = feedbackList.reduce((acc, c) => acc + (c.feedback?.rating || 0), 0);
        const avg = (sum / total).toFixed(1);

        document.getElementById('avg-score').textContent = `${avg} / 5.0`;
        document.getElementById('total-reviews').textContent = total;

        container.innerHTML = `
          <div class="feedback-grid">
            ${feedbackList.map(c => {
              const starsHtml = [1,2,3,4,5].map(n => n <= c.feedback.rating ? icon('star-fill', 16) : icon('star', 16)).join('');
              return `
                <div class="feedback-card">
                  <div style="display:flex; justify-content:space-between; align-items:center;">
                    <span class="star-display">${starsHtml}</span>
                    <span class="ticket-id">${c.ticketId || 'TICKET'}</span>
                  </div>
                  <div style="font-weight:600; color:var(--gray-800);">${c.title || c.category}</div>
                  <p style="font-size:13.5px; color:var(--gray-700); line-height:1.5;">
                    "${c.feedback.message || 'No additional comment provided.'}"
                  </p>
                  <hr class="divider" style="margin:4px 0;">
                  <div style="display:flex; justify-content:space-between; font-size:12px; color:var(--gray-400);">
                    <span>${icon('user', 12)} ${c.studentName || 'Student'}</span>
                    <span>${formatDate(c.feedback.submittedAt || c.resolvedAt)}</span>
                  </div>
                  ${c.assignedStaff ? `
                  <div style="font-size:11.5px; color:var(--primary-700); background:var(--primary-50); padding:4px 8px; border-radius:4px;">
                    Handled by: ${c.assignedStaff.name}
                  </div>` : ''}
                </div>`;
            }).join('')}
          </div>`;
      } catch (err) {
        container.innerHTML = `
          <div class="empty-state"><div class="empty-icon">${icon('alert-circle', 36)}</div><h3>Failed to load feedback</h3><p>${err.message}</p></div>`;
      }
    }
  </script>
</body>
</html>

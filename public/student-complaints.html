<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>My Complaints — Campus Maintenance</title>
  <link rel="stylesheet" href="/css/main.css">
</head>
<body data-page="student-complaints">
  <div class="app-layout">
    <div id="sidebar-placeholder"></div>
    <div class="main-content">
      <header class="top-header">
        <div class="header-left">
          <button class="menu-toggle" id="menu-toggle" aria-label="Toggle menu"></button>
          <div>
            <div class="page-title">My Complaints</div>
            <div class="page-subtitle">All your submitted maintenance requests</div>
          </div>
        </div>
        <div class="header-right">
          <a href="/student-notifications.html">
            <button class="header-btn" id="header-notif-btn" title="Notifications">
              <span class="notif-dot" id="header-notif-dot" style="display:none;"></span>
            </button>
          </a>
          <a href="/student-submit.html" class="btn btn-primary btn-sm" id="btn-new-complaint">
            New Complaint
          </a>
          <button class="btn btn-ghost btn-sm" onclick="logout()" id="header-logout-btn">
            Sign Out
          </button>
          <a href="/student-profile.html"><div class="header-avatar" id="header-avatar">U</div></a>
        </div>
      </header>

      <main class="page-content">
        <div class="card">
          <!-- Filters -->
          <div class="filters-bar">
            <div class="search-input-wrap">
              <span class="search-icon" id="search-icon"></span>
              <input id="search" type="text" class="search-input" placeholder="Search by ticket ID or title…">
            </div>
            <select id="filter-status" class="filter-select">
              <option value="">All Statuses</option>
              <option>Submitted</option>
              <option>Assigned</option>
              <option>In Progress</option>
              <option>Resolved</option>
              <option>Closed</option>
            </select>
            <select id="filter-category" class="filter-select">
              <option value="">All Categories</option>
              <option>Electrical</option>
              <option>Plumbing</option>
              <option>Cleanliness</option>
              <option>Furniture</option>
              <option>Internet and Networking</option>
              <option>Laboratory Equipment</option>
              <option>Hostel Maintenance</option>
              <option>Other</option>
            </select>
            <select id="filter-priority" class="filter-select">
              <option value="">All Priorities</option>
              <option>Low</option>
              <option>Medium</option>
              <option>High</option>
              <option>Urgent</option>
            </select>
          </div>

          <!-- Table -->
          <div id="table-body">
            <div class="loading-overlay"><div class="spinner"></div></div>
          </div>

          <!-- Pagination -->
          <div class="pagination-wrap">
            <span id="page-info" class="text-muted"></span>
            <div class="pagination" id="pagination"></div>
          </div>
        </div>
      </main>
    </div>
  </div>

  <script src="/js/icons.js"></script>
  <script src="/js/auth.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/sidebar.js"></script>
  <script>
    const user = requireAuth(['student']);
    if (user) {
      initSidebar('student', 'student-complaints');
      document.getElementById('menu-toggle').innerHTML = icon('menu', 18);
      document.getElementById('header-notif-btn').innerHTML = icon('bell', 18) + '<span class="notif-dot" id="header-notif-dot" style="display:none;"></span>';
      document.getElementById('header-logout-btn').innerHTML = `${icon('log-out', 15)} <span>Sign Out</span>`;
      document.getElementById('btn-new-complaint').innerHTML = `${icon('plus', 14)} <span>New Complaint</span>`;
      document.getElementById('search-icon').innerHTML = icon('search', 16);

      loadComplaints();
      setupDataSync(loadComplaints, 4000);
    }

    let allComplaints = [];
    let currentPage = 1;
    const PAGE_SIZE = 10;

    async function loadComplaints() {
      try {
        allComplaints = await apiGet('/complaints/mine') || [];
        applyFilters();
      } catch (err) {
        document.getElementById('table-body').innerHTML =
          `<div class="empty-state"><div class="empty-icon">${icon('alert-circle', 36)}</div><h3>Failed to load</h3><p>${err.message}</p></div>`;
      }
    }

    function applyFilters() {
      const search = document.getElementById('search').value.toLowerCase().trim();
      const status = document.getElementById('filter-status').value;
      const category = document.getElementById('filter-category').value;
      const priority = document.getElementById('filter-priority').value;

      let filtered = allComplaints.filter(c => {
        if (search) {
          const matchTicket = (c.ticketId || '').toLowerCase().includes(search);
          const matchTitle = (c.title || '').toLowerCase().includes(search);
          if (!matchTicket && !matchTitle) return false;
        }
        if (status) {
          if (status === 'Submitted' && !(c.status === 'Submitted' || c.status === 'Pending')) return false;
          if (status !== 'Submitted' && c.status !== status) return false;
        }
        if (category && c.category !== category) return false;
        if (priority && c.priority !== priority) return false;
        return true;
      });

      currentPage = 1;
      renderTable(filtered);
    }

    document.getElementById('search').addEventListener('input', applyFilters);
    document.getElementById('filter-status').addEventListener('change', applyFilters);
    document.getElementById('filter-category').addEventListener('change', applyFilters);
    document.getElementById('filter-priority').addEventListener('change', applyFilters);

    function renderTable(filtered) {
      const body = document.getElementById('table-body');
      const total = filtered.length;
      const totalPages = Math.ceil(total / PAGE_SIZE) || 1;
      const start = (currentPage - 1) * PAGE_SIZE;
      const paged = filtered.slice(start, start + PAGE_SIZE);

      document.getElementById('page-info').textContent = total
        ? `Showing ${start + 1}–${Math.min(start + PAGE_SIZE, total)} of ${total} complaints`
        : '0 complaints found';

      if (!paged.length) {
        body.innerHTML = `
          <div class="empty-state">
            <div class="empty-icon">${icon('clipboard', 40)}</div>
            <h3>No complaints found</h3>
            <p>Try clearing filters or submit a new complaint.</p>
          </div>`;
        document.getElementById('pagination').innerHTML = '';
        return;
      }

      body.innerHTML = `
        <div class="table-wrapper">
          <table class="table">
            <thead>
              <tr>
                <th>Ticket ID</th>
                <th>Title / Category</th>
                <th>Location</th>
                <th>Priority</th>
                <th>Status</th>
                <th>Assigned Staff</th>
                <th>Submitted</th>
                <th>Action</th>
              </tr>
            </thead>
            <tbody id="student-tbody"></tbody>
          </table>
        </div>`;

      const tbody = document.getElementById('student-tbody');
      paged.forEach(c => {
        const tr = document.createElement('tr');
        tr.innerHTML = `
          <td><span class="ticket-id">${c.ticketId || c._id.slice(-6).toUpperCase()}</span></td>
          <td>
            <div style="font-weight:600;color:var(--gray-800)">${c.title || c.category}</div>
            <div style="font-size:12px;color:var(--gray-400)">${c.category}</div>
          </td>
          <td>${c.building ? c.building + ', ' : ''}Room ${c.roomNumber}</td>
          <td>${priorityBadge(c.priority || 'Medium')}</td>
          <td>${statusBadge(c.status)}</td>
          <td>${c.assignedStaff ? c.assignedStaff.name : '<span style="color:var(--gray-400)">Pending assignment</span>'}</td>
          <td>${formatDate(c.createdAt)}</td>
          <td>
            <a href="/student-complaint-detail.html?id=${c._id}" class="btn btn-outline btn-sm">View Details</a>
          </td>`;
        tbody.appendChild(tr);
      });

      renderPagination('pagination', currentPage, totalPages, (p) => {
        currentPage = p;
        renderTable(filtered);
      });
    }
  </script>
</body>
</html>
